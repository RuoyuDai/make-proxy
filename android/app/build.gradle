plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Auto version: yyyy.MM.dd.N where N is the Nth build of the day.
def versionFile = file('version.properties')
def versionProps = new Properties()
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def today = new Date().format('yyyy.MM.dd')
def buildCount = (versionProps.getProperty('date') == today) ?
        (versionProps.getProperty('count', '0') as int) + 1 : 1
versionProps.setProperty('date', today)
versionProps.setProperty('count', buildCount.toString())
versionFile.withOutputStream { versionProps.store(it, null) }
def autoVersionName = "${today}.${buildCount}"
def autoVersionCode = (today.replace('.', '') as int) * 100 + buildCount

android {
    namespace 'com.ruoyudai.makeproxy'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.ruoyudai.makeproxy"
        minSdk 26
        targetSdk 34
        versionCode autoVersionCode
        versionName autoVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
